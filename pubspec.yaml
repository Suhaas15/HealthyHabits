name: healthyhabits
description: Healthy Habits - Educational Stories for Kids
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.3
  http: ^1.2.1
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  flutter_animate: ^4.5.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: false
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "icon/icon.png"
  image_path: "icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon.png
    - assets/splash-icon.png
